# Copia este archivo a ~/.config/odoo-agent/profiles.toml y añade una sección por base.
# Aquí no van claves: la de cada perfil se guarda en GNOME Keyring con
#   secret-tool store --label "odoo-agent: <perfil>" service odoo-agent profile <perfil>

[profiles.acme-prod]
url = "https://acme.odoo.com"
hosting = "online"          # online | odoo.sh | onpremise
env = "prod"                # prod | staging | test
# db = "acme"               # solo si el servidor aloja varias bases y no las distingue por dominio
# ai_agent = "Odoo Agent"   # agente de la app IA para el cotejo; por defecto, el primero que pase la revisión

[profiles.acme-staging]
url = "https://acme-staging-12345678.dev.odoo.com"
hosting = "odoo.sh"
env = "staging"
