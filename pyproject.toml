[project]
name = "odoo-agent"
version = "0.1.0"
description = "Servidor MCP de solo lectura para Odoo 19+ con cotejo en la IA de Odoo"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
]

[project.scripts]
odoo-mcp = "odoo_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
